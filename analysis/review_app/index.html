<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartwheel Trace Review</title>
<style>
  :root {
    --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --bg:#f8f9fb; --panel:#fff;
    --user:#2563eb; --user-bg:#eff6ff;
    --think:#64748b; --think-bg:#f1f5f9;
    --reason:#0d9488; --reason-bg:#f0fdfa;
    --call:#b45309; --call-bg:#fffbeb;
    --result:#7c3aed; --result-bg:#faf5ff;
    --reply:#059669; --reply-bg:#ecfdf5;
    --flag:#dc2626; --flag-bg:#fef2f2; --warn:#b45309; --warn-bg:#fef3c7;
    --hl:#fde68a; --sugg:#9333ea; --reviewed:#f97316;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; color:var(--ink); background:var(--bg); }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12.5px; }

  /* top bar */
  .top { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; padding:10px 18px; background:#fff; border-bottom:1px solid var(--line); }
  .tabs button { border:1px solid var(--line); background:#fff; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:14px; color:var(--ink); }
  .tabs button.active { background:#111827; color:#fff; border-color:#111827; }
  .spacer { flex:1; }
  .nav button { border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 10px; cursor:pointer; }
  .nav select { border:1px solid var(--line); border-radius:6px; padding:4px 6px; font-size:13px; }
  .stat { color:var(--muted); font-size:13px; }

  /* content layout: article + margin */
  .view { display:none; } .view.active { display:block; }
  .wrap { display:flex; justify-content:center; gap:24px; padding:22px 18px 80px; }
  .article { flex:1; max-width:860px; min-width:0; }
  .margin { width:280px; position:relative; flex-shrink:0; }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px; }
  .title { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .title h2 { margin:0 8px 0 0; font-size:21px; }
  .chip { font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:5px; background:#eef2ff; color:#4338ca; }
  .chip.role { background:#ecfdf5; color:#047857; } .chip.batch { background:#fff7ed; color:#c2410c; }
  .flag { font-size:11px; font-weight:600; padding:2px 7px; border-radius:5px; background:var(--flag-bg); color:var(--flag); border:1px solid #fecaca; }
  .flag.info { background:var(--warn-bg); color:var(--warn); border-color:#fde68a; }
  .meta { display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--muted); font-size:13px; margin-top:10px; }
  .meta b { color:var(--ink); font-weight:500; }
  .meta a { color:var(--user); }
  .actions { display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px 11px; cursor:pointer; font-size:13px; }
  .btn.on { background:#ecfdf5; border-color:var(--reply); color:var(--reply); }
  .btn.primary { background:#111827; color:#fff; border-color:#111827; }
  .reviewed { font-size:13px; font-weight:600; }
  .reviewed.yes { color:var(--reply); } .reviewed.no { color:var(--muted); }

  details.extra { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; padding:8px 12px; margin-top:12px; }
  details.extra summary { cursor:pointer; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#15803d; }
  details.extra .body { margin-top:6px; font-size:14px; }
  details.extra .src { color:var(--muted); font-size:12px; margin-top:4px; }
  details.sys { background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-bottom:14px; font-size:13px; color:var(--muted); }
  details.sys summary { cursor:pointer; }
  details.sys pre { white-space:pre-wrap; color:var(--ink); }
  .ctx { white-space:pre-wrap; background:#f9fafb; border-radius:6px; padding:6px 10px; margin-top:6px; color:var(--ink); }

  .turn { margin:34px 0 10px; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
  .turn::after { content:""; flex:1; height:1px; background:var(--line); }
  .turn a { color:var(--muted); text-transform:none; font-weight:500; letter-spacing:0; }

  .blk { border-left:4px solid; border-radius:4px 8px 8px 4px; padding:10px 14px; margin:6px 0; }
  .blk .lab { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-bottom:4px; display:flex; gap:8px; align-items:center; }
  .blk .txt { white-space:pre-wrap; }
  .blk.user { border-color:var(--user); background:var(--user-bg); } .blk.user .lab { color:var(--user); }
  .blk.thinking { border-color:var(--think); background:var(--think-bg); } .blk.thinking .lab { color:var(--think); }
  .blk.thinking .txt { font-style:italic; color:#334155; }
  .blk.reasoning { border-color:var(--reason); background:var(--reason-bg); } .blk.reasoning .lab { color:var(--reason); }
  .blk.call { border-color:var(--call); background:var(--call-bg); } .blk.call .lab { color:var(--call); }
  .blk.result { border-color:var(--result); background:var(--result-bg); } .blk.result .lab { color:var(--result); }
  .blk.reply { border-color:var(--reply); background:var(--reply-bg); } .blk.reply .lab { color:var(--reply); }
  .step { border:1px solid #fde68a; border-radius:10px; padding:4px 8px; margin:16px 0; background:#fffdf5; }
  .fname { font-family: ui-monospace, Menlo, monospace; font-weight:700; color:var(--call); font-size:14px; }
  pre.json { background:rgba(255,255,255,.7); border-radius:6px; padding:8px 10px; margin:6px 0 0; white-space:pre-wrap; word-break:break-word; }
  .more { font-size:12px; color:var(--result); cursor:pointer; text-decoration:underline; margin-top:4px; display:inline-block; }
  .md p { margin:.35em 0; } .md ul, .md ol { margin:.3em 0; padding-left:1.4em; }
  .md table { border-collapse:collapse; margin:.5em 0; font-size:13.5px; } .md td, .md th { border:1px solid #d1fae5; padding:3px 8px; text-align:left; }
  .md code { background:rgba(0,0,0,.05); padding:0 4px; border-radius:3px; }

  mark.hl { background:var(--hl); border-radius:2px; padding:0 1px; }
  mark.hl.ff { background:#fecaca; }
  mark.sg { background:rgba(147,51,234,.10); border-bottom:2px dashed var(--sugg); }
  mark.hl.hot, mark.sg.hot { outline:2px solid #111827; }
  .pending { background:#bfdbfe; }

  /* margin notes */
  .mnote { position:absolute; left:0; right:0; background:#fff; border:1px solid var(--line); border-left:4px solid #eab308; border-radius:6px; padding:8px 10px; font-size:13px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .mnote.ff { border-left-color:var(--flag); }
  .mnote.nf { border-left-color:var(--reply); }
  .mnote.sg { border:1px dashed var(--sugg); border-left:4px dashed var(--sugg); background:#faf5ff; }
  .mnote.hot { box-shadow:0 0 0 2px #111827; }
  .mnote .q { color:var(--muted); font-style:italic; font-size:12px; margin-bottom:4px; }
  .mnote .tag { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--flag); }
  .mnote.sg .tag { color:var(--sugg); } .mnote.nf .tag { color:var(--reply); }
  .mnote .acts { display:none; gap:6px; margin-top:6px; }
  .mnote:hover .acts, .mnote.sg .acts { display:flex; }
  .mnote .acts button { font-size:11px; border:1px solid var(--line); background:#fff; border-radius:4px; padding:2px 7px; cursor:pointer; }

  /* popover */
  #pop { position:absolute; z-index:30; display:none; width:320px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; box-shadow:0 8px 24px rgba(0,0,0,.12); }
  #pop textarea { width:100%; height:78px; font:inherit; font-size:13px; padding:6px; border:1px solid var(--line); border-radius:6px; }
  #pop label { font-size:13px; display:flex; gap:6px; align-items:center; margin:6px 0; }
  #pop .hint { color:var(--muted); font-size:12px; }

  /* map */
  .mapwrap { padding:18px; display:flex; gap:18px; }
  #map { background:#fff; border:1px solid var(--line); border-radius:10px; flex:1; }
  .legend { width:260px; font-size:13px; }
  .legend .row { display:flex; gap:8px; align-items:center; margin:4px 0; }
  #tip { position:fixed; pointer-events:none; background:#111827; color:#fff; font-size:12px; padding:6px 8px; border-radius:6px; display:none; z-index:40; max-width:320px; }

  /* progress + labels */
  .page { max-width:1180px; margin:0 auto; padding:22px 18px 80px; }
  .page h3 { margin:26px 0 10px; }
  .kpis { display:flex; gap:12px; flex-wrap:wrap; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 16px; min-width:150px; }
  .kpi .n { font-size:24px; font-weight:700; } .kpi .l { color:var(--muted); font-size:12px; }
  table.grid { border-collapse:collapse; width:100%; background:#fff; font-size:13px; }
  table.grid th, table.grid td { border:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top; }
  table.grid th { background:#f9fafb; position:sticky; top:52px; }
  .link { color:var(--user); cursor:pointer; }
  .tree { display:flex; flex-wrap:wrap; gap:8px; }
  .mode { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-width:220px; }
  .mode h4 { margin:0 0 4px; font-family:ui-monospace, Menlo, monospace; font-size:14px; }
  .mode .def { color:var(--muted); font-size:12.5px; margin-bottom:6px; }
  .mode li { font-size:12.5px; cursor:pointer; margin:2px 0; }
  .mode li:hover { color:var(--user); }
  .cell { display:flex; gap:3px; }
  .cell button { border:1px solid var(--line); background:#fff; border-radius:4px; padding:1px 7px; font-size:12px; cursor:pointer; }
  .cell button.pass.on { background:#dcfce7; border-color:#16a34a; color:#166534; font-weight:700; }
  .cell button.fail.on { background:#fee2e2; border-color:#dc2626; color:#991b1b; font-weight:700; }
  td.dirty { background:#fffbeb; }
  td.missing { background:#fef2f2; }
  #toast { position:fixed; right:18px; bottom:18px; background:#111827; color:#fff; padding:10px 14px; border-radius:8px; font-size:13px; display:none; z-index:50; }
  .empty { color:var(--muted); padding:30px; text-align:center; }
</style>
</head>
<body>
<div class="top">
  <div class="tabs">
    <button data-view="content" class="active">Content</button>
    <button data-view="map">Map</button>
    <button data-view="progress">Progress</button>
    <button data-view="labels">Labels</button>
  </div>
  <div class="spacer"></div>
  <div class="nav">
    <select id="scope" title="Which conversations to page through">
      <option value="sample">Sample</option>
      <option value="all">All 250</option>
    </select>
    <button id="prev" title="Previous (←)">←</button>
    <span id="pos" class="stat"></span>
    <button id="next" title="Next (→)">→</button>
  </div>
  <span id="topstat" class="stat"></span>
</div>

<section id="view-content" class="view active">
  <div class="wrap">
    <div class="article" id="article"><div class="empty">Loading…</div></div>
    <div class="margin" id="margin"></div>
  </div>
</section>

<section id="view-map" class="view">
  <div class="mapwrap">
    <svg id="map" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="legend" id="legend"></div>
  </div>
</section>

<section id="view-progress" class="view"><div class="page" id="progress"></div></section>
<section id="view-labels" class="view"><div class="page" id="labels"></div></section>

<div id="pop">
  <textarea id="popText" placeholder="What went wrong here? (Enter to save, Shift+Enter for a new line)"></textarea>
  <label><input type="checkbox" id="popFirst"> This is the first failure in the conversation</label>
  <div style="display:flex;gap:6px;justify-content:space-between;align-items:center">
    <span class="hint" id="popQuote"></span>
    <span><button class="btn" id="popCancel">Cancel</button> <button class="btn primary" id="popSave">Save</button></span>
  </div>
</div>
<div id="tip"></div>
<div id="toast"></div>

<script>
// ---------------------------------------------------------------------------
// state
// ---------------------------------------------------------------------------
const S = {
  view: "content", scope: "sample", convs: [], byId: {}, full: {}, meta: {},
  samples: {batches: [], conversations: []}, annotations: [], patterns: {modes: []},
  suggestions: [], labels: {}, graph: {nodes: [], clusters: []},
  cur: null, draftLabels: {}, pending: null,
};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => "a_" + Math.random().toString(36).slice(2, 10);
const now = () => new Date().toISOString();
const api = async (p, body) => {
  const r = await fetch(p, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  return r.json();
};
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3500); }

// ---------------------------------------------------------------------------
// derived
// ---------------------------------------------------------------------------
const sampleEntry = id => S.samples.conversations.find(c => c.id === id);
const annsFor = id => S.annotations.filter(a => a.conversation_id === id);
const isReviewed = id => annsFor(id).some(a => a.kind === "no_failure" || a.kind === "note");
const scopeIds = () => S.scope === "sample" && S.samples.conversations.length
  ? S.samples.conversations.map(c => c.id) : S.convs.map(c => c.id);
function liveModes() { return (S.patterns.modes || []).filter(m => m.status !== "rejected"); }

// ---------------------------------------------------------------------------
// markdown (small, safe: escapes first)
// ---------------------------------------------------------------------------
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<i>$2</i>");
}
function md(src) {
  const lines = esc(src).split("\n"); let out = [], list = null, table = [];
  const flushList = () => { if (list) { out.push(`<${list.t}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.t}>`); list = null; } };
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^[\s|:-]+$/.test(r));  // drop the |---|---| separator row
    out.push("<table>" + rows.map((r, i) => "<tr>" + r.trim().replace(/^\||\|$/g, "").split("|").map(c => i === 0 ? `<th>${inline(c.trim())}</th>` : `<td>${inline(c.trim())}</td>`).join("") + "</tr>").join("") + "</table>");
    table = [];
  };
  for (const raw of lines) {
    const l = raw.trimEnd();
    if (/^\s*\|.*\|\s*$/.test(l)) { flushList(); table.push(l); continue; } else flushTable();
    let m;
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (!list || list.t !== "ul") { flushList(); list = {t: "ul", items: []}; } list.items.push(m[1]); continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (!list || list.t !== "ol") { flushList(); list = {t: "ol", items: []}; } list.items.push(m[1]); continue; }
    flushList();
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { out.push(`<p><b>${inline(m[1])}</b></p>`); continue; }
    if (l.trim()) out.push(`<p>${inline(l)}</p>`);
  }
  flushList(); flushTable();
  return out.join("");
}

// ---------------------------------------------------------------------------
// content view
// ---------------------------------------------------------------------------
function jsonBlock(v, collapseAt = 14) {
  const txt = typeof v === "string" ? v : JSON.stringify(v, null, 2);
  const lines = txt.split("\n");
  if (lines.length <= collapseAt) return `<pre class="json">${esc(txt)}</pre>`;
  const head = lines.slice(0, 6).join("\n") + "\n  …";
  return `<pre class="json" data-full="${esc(txt)}" data-head="${esc(head)}">${esc(head)}</pre><span class="more" onclick="toggleFull(this)">Show full result (${lines.length} lines)</span>`;
}
function toggleFull(el) {
  const pre = el.previousElementSibling, full = pre.textContent.length < pre.dataset.full.length;
  pre.textContent = full ? pre.dataset.full : pre.dataset.head;
  el.textContent = full ? `Hide full result (${pre.dataset.full.split("\n").length} lines)` : `Show full result (${pre.dataset.full.split("\n").length} lines)`;
  requestAnimationFrame(layoutMargin);
}
function resultSummary(r) {
  if (!r || typeof r !== "object") return "";
  const bits = [];
  if ("ok" in r) bits.push(`ok: ${r.ok}`);
  for (const k of ["status", "error", "refund_id", "ticket_id", "count", "total_count"]) if (k in r) bits.push(`${k}: ${r[k]}`);
  return bits.join(" · ");
}
const FLAG_INFO = new Set(["queued_for_approval", "auto_approved", "cancelled", "escalated"]);
const flagHtml = f => `<span class="flag ${FLAG_INFO.has(f) ? "info" : ""}">${esc(f.replace("error:", "error: "))}</span>`;

async function openConv(id) {
  S.cur = id;
  if (!S.full[id]) S.full[id] = await api(`/api/conversation/${id}`);
  renderContent(); updateTop();
  history.replaceState(null, "", `#${S.byId[id].scenario_id}`);
}

function renderContent() {
  const c = S.full[S.cur];
  if (!c) { $("#article").innerHTML = `<div class="empty">No conversation selected.</div>`; $("#margin").innerHTML = ""; return; }
  const t = c.scenario.tuple || {}, e = c.scenario.expected || {}, se = sampleEntry(c.id);
  const reviewed = isReviewed(c.id), nf = annsFor(c.id).some(a => a.kind === "no_failure");
  const base = (S.meta.langfuse_host || "http://localhost:3000");
  let h = `<div class="card">
    <div class="title"><h2>${esc(c.scenario_id)}</h2>
      <span class="chip">${esc(c.scenario.group || "")}</span><span class="chip">${esc(t.intent || "")}</span>
      <span class="chip role">${esc(c.role)}</span>${se ? `<span class="chip batch">${esc(se.batch)}</span>` : ""}
      ${c.flags.map(flagHtml).join(" ")}
    </div>
    <div class="meta">
      <span>Role: <b>${esc(c.role)}</b></span><span>User: <b>${esc(c.user_id)}</b></span>
      <span>Difficulty: <b>${esc(t.difficulty)}</b></span><span>Style: <b>${esc(t.user_style)}</b></span>
      <span>Turns: <b>${c.turns.length}</b></span><span>Tool calls: <b>${c.tools.length}</b></span>
      <span>Latency: <b>${c.latency.toFixed(1)}s</b></span><span>Cost: <b>$${c.cost.toFixed(4)}</b></span>
      <span>Session: <b class="mono">${esc(c.id.slice(0, 12))}…</b></span>
    </div>
    <details class="extra"><summary>Extra metadata (HW3 expected outcome) — click to expand</summary>
      <div class="body">${e.outcome ? `<b>${esc(e.outcome)}</b><br>` : ""}${esc(e.reason || e.criterion || "")}</div>
      <div class="src">${esc(e.evaluation || "")} · source: ${esc(e.source?.type || "")} / ${esc(e.source?.reference || "")}
        · record_state: ${esc(t.record_state)} · policy: ${esc(t.applicable_policy)}${c.scenario.data_quality_case_id ? " · " + esc(c.scenario.data_quality_case_id) : ""}</div>
    </details>
    <div class="actions">
      <span class="reviewed ${reviewed ? "yes" : "no"}">${reviewed ? "✓ Reviewed" : "Not reviewed yet"}</span>
      <button class="btn ${nf ? "on" : ""}" onclick="toggleNoFailure()">${nf ? "✓ No failure observed" : "No failure observed"}</button>
      <span class="stat">Select any text to write a note.</span>
    </div>
  </div>
  <details class="sys"><summary>System prompt — session context shown; click to expand the static instructions</summary>
    <pre>${esc(S.meta.static_system_prompt || "")}</pre></details>
  <div class="ctx mono" style="margin:-6px 0 12px">${esc(c.session_context)}</div>`;

  c.turns.forEach(turn => {
    const n = turn.index;
    h += `<div class="turn">Turn ${n + 1} of ${c.turns.length}
      <a href="${base}/project/cartwheel-dev/traces/${turn.trace_id}" target="_blank" title="Open in Langfuse">trace ${turn.trace_id.slice(0, 8)}… ↗</a>
      <span style="font-weight:500;letter-spacing:0;text-transform:none">${turn.latency.toFixed(1)}s</span></div>`;
    h += blk("user", `t${n}-user`, turn.trace_id, "User", `<div class="txt">${esc(turn.user)}</div>`);
    turn.steps.forEach(step => {
      h += `<div class="step">`;
      step.thoughts.forEach((th, i) => {
        h += th.kind === "thinking"
          ? blk("thinking", `${step.id}-th${i}`, turn.trace_id, "Thinking (internal)", `<div class="txt">${esc(th.text)}</div>`)
          : blk("reasoning", `${step.id}-rs${i}`, turn.trace_id, "Reasoning", `<div class="txt md">${md(th.text)}</div>`);
      });
      step.calls.forEach((call, i) => {
        h += blk("call", `${step.id}-c${i}`, turn.trace_id, "Tool call", `<div class="fname">${esc(call.name)}</div>${jsonBlock(call.arguments, 30)}`);
        h += blk("result", `${step.id}-r${i}`, turn.trace_id,
          `Tool result <span style="font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)">${esc(resultSummary(call.result))}</span> ${call.flags.map(flagHtml).join(" ")}`,
          jsonBlock(call.result));
      });
      h += `</div>`;
    });
    h += blk("reply", `t${n}-reply`, turn.trace_id, "Assistant", `<div class="md">${md(turn.reply)}</div>`);
  });
  $("#article").innerHTML = h;
  paintAnnotations();
}
function blk(kind, id, traceId, label, inner) {

function wrapQuote(block, quote, cls, id) {
  if (!block || !quote) return null;
  const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode())) {
    if (node.parentElement.closest(".lab")) continue;
    const i = node.nodeValue.indexOf(quote);
    if (i >= 0) {
      const r = document.createRange(); r.setStart(node, i); r.setEnd(node, i + quote.length);
      const m = document.createElement("mark"); m.className = cls; m.dataset.id = id;
      r.surroundContents(m); return m;
    }
  }
  // Quote spans several elements: fall back to marking the start of the first text node.
  const words = quote.split(/\s+/).slice(0, 4).join(" ");
  return words && words !== quote ? wrapQuote(block, words, cls, id) : null;
}
function paintAnnotations() {
  const c = S.full[S.cur]; if (!c) return;

  for (const a of annsFor(c.id)) {

    const mark = a.kind === "note" ? wrapQuote(block, a.quote, "hl" + (a.first_failure ? " ff" : ""), a.id) : null;
    notes.push({a, mark, block, kind: "human"});
  }
  for (const s of S.suggestions.filter(s => s.conversation_id === c.id && s.status === "pending")) {
    const block = s.block_id ? $(`[data-block="${s.block_id}"]`, $("#article")) : null;
    const mark = wrapQuote(block, s.quote, "sg", s.id);
    notes.push({a: s, mark, block, kind: "suggestion"});
  }
  const margin = $("#margin");
  margin.innerHTML = notes.map(({a, kind}) => kind === "suggestion"
    ? `<div class="mnote sg" data-id="${a.id}"><div class="tag">Agent suggestion · ${esc(a.mode)}</div>
         ${a.quote ? `<div class="q">“${esc(a.quote.slice(0, 120))}”</div>` : ""}<div>${esc(a.rationale || "")}</div>
         <div class="acts"><button onclick="decideSuggestions(['${a.id}'],'accepted')">Accept</button><button onclick="decideSuggestions(['${a.id}'],'rejected')">Dismiss</button></div></div>`
    : `<div class="mnote ${a.kind === "no_failure" ? "nf" : a.first_failure ? "ff" : ""}" data-id="${a.id}">
         ${a.kind === "no_failure" ? `<div class="tag">No failure observed</div>` : a.first_failure ? `<div class="tag">First failure</div>` : ""}
         ${a.quote ? `<div class="q">“${esc(a.quote.slice(0, 120))}”</div>` : ""}<div>${esc(a.note || "")}</div>
         ${a.source === "accepted_suggestion" ? `<div class="stat">from an accepted suggestion</div>` : ""}
         <div class="acts">${a.kind === "note" ? `<button onclick="editNote('${a.id}')">Edit</button><button onclick="toggleFirst('${a.id}')">${a.first_failure ? "Unmark first" : "Mark first failure"}</button>` : ""}
           <button onclick="deleteNote('${a.id}')">Delete</button></div></div>`).join("");
  margin._notes = notes;

    el.onmouseenter = () => m && m.classList.add("hot"); el.onmouseleave = () => m && m.classList.remove("hot");
    if (m) { m.onmouseenter = () => el.classList.add("hot"); m.onmouseleave = () => el.classList.remove("hot"); }

function layoutMargin() {

async function decideSuggestions(ids, status) {
  let reason = "";
  if (status === "rejected") { reason = prompt(`Why dismiss ${ids.length > 1 ? ids.length + " suggestions" : "this suggestion"}? (the boundary that excludes it)`) ; if (reason === null) return; }
  for (const id of ids) {
    const s = S.suggestions.find(x => x.id === id); if (!s || s.status !== "pending") continue;
    s.status = status; s.decided_at = now(); s.decision_reason = reason;
    if (status === "accepted") {
      const c = S.byId[s.conversation_id];
      S.annotations.push({id: uid(), conversation_id: s.conversation_id, scenario_id: c?.scenario_id, trace_id: s.trace_id || c?.trace_ids[0],
        block_id: s.block_id || null, quote: s.quote || "", note: `[${s.mode}] ${s.rationale || ""}`.trim(), first_failure: false,
        kind: "note", source: "accepted_suggestion", suggestion_id: s.id, author: "human", batch: sampleEntry(s.conversation_id)?.batch || null, ts: now()});
    }
  }
  await api("/api/suggestions", S.suggestions); await saveAnnotations();
  toast(`${ids.length} suggestion(s) ${status}`); render();
}

const CL = ["#2563eb", "#059669", "#d97706", "#7c3aed", "#db2777", "#0891b2", "#65a30d", "#dc2626", "#475569", "#a16207"];
function hull(pts) {
  if (pts.length < 3) return pts;
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.slice().reverse()) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}

  }

    const r = s ? 7 : 4.5, fill = rev ? "var(--reviewed)" : CL[n.cluster % 10], stroke = s ? "#111827" : "none", sw = s ? 1.8 : 0;
    const attrs = `class="pt" data-id="${n.id}" fill="${fill}" fill-opacity="${s ? 1 : .55}" stroke="${stroke}" stroke-width="${sw}"`;
    g += n.role === "merchant" ? `<rect x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}" ${attrs}/>`

function step(d) { const ids = scopeIds(); if (!ids.length) return; let i = ids.indexOf(S.cur); i = i < 0 ? 0 : Math.min(ids.length - 1, Math.max(0, i + d)); openConv(ids[i]); }
$("#prev").onclick = () => step(-1); $("#next").onclick = () => step(1);
$("#scope").onchange = e => { S.scope = e.target.value; const ids = scopeIds(); if (!ids.includes(S.cur) && ids.length) openConv(ids[0]); else updateTop(); };
document.addEventListener("keydown", e => {
  if (e.target.closest("textarea, input, select") || $("#pop").style.display === "block") return;
  if (S.view === "content" && e.key === "ArrowRight") step(1);
  if (S.view === "content" && e.key === "ArrowLeft") step(-1);
});
function setView(v) {
  S.view = v; document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("active", s.id === "view-" + v)); render();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setView(b.dataset.view));
function render() {
  if (S.view === "content") renderContent(); if (S.view === "map") renderMap();
  if (S.view === "progress") renderProgress(); if (S.view === "labels") renderLabels(); updateTop();
}

let sig = {};
async function poll() {
  const [samples, patterns, suggestions] = await Promise.all([api("/api/samples"), api("/api/patterns"), api("/api/suggestions")]);
  const next = {samples: JSON.stringify(samples), patterns: JSON.stringify(patterns), suggestions: JSON.stringify(suggestions)};
  const changed = Object.keys(next).filter(k => sig[k] !== undefined && sig[k] !== next[k]);
  sig = next; S.samples = samples; S.patterns = patterns; S.suggestions = suggestions;
  if (changed.length) {
    toast(changed.includes("samples") ? "New sample conversations added" : changed.includes("suggestions") ? "New agent suggestions" : "Taxonomy updated");
    if (S.view !== "content") render(); else { paintAnnotationsSafe(); updateTop(); }
  }
}
function paintAnnotationsSafe() { if ($("#pop").style.display !== "block") renderContent(); }

(async function init() {
  const [convs, meta, samples, anns, patterns, sugg, labels, graph] = await Promise.all([
    api("/api/conversations"), api("/api/meta"), api("/api/samples"), api("/api/annotations"),
    api("/api/patterns"), api("/api/suggestions"), api("/api/labels"), api("/api/graph")]);
  Object.assign(S, {convs, meta, samples, annotations: anns.annotations || [], patterns, suggestions: sugg, labels, graph});
  S.convs.forEach(c => S.byId[c.id] = c);
  sig = {samples: JSON.stringify(samples), patterns: JSON.stringify(patterns), suggestions: JSON.stringify(sugg)};
  if (!S.samples.conversations?.length) { S.samples = {batches: [], conversations: []}; S.scope = "all"; $("#scope").value = "all"; }
  const fromHash = S.convs.find(c => c.scenario_id === decodeURIComponent(location.hash.slice(1)));
  const ids = scopeIds();
  await openConv(fromHash ? fromHash.id : ids.find(id => !isReviewed(id)) || ids[0]);
  const v = new URLSearchParams(location.search).get("view");
  if (["map", "progress", "labels"].includes(v)) setView(v);
  setInterval(poll, 4000);
})();
</script>
